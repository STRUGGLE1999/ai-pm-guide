name: Daily AI Interview Questions Sync

on:
  schedule:
    # 每天北京时间上午 09:00 准时触发 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动一键触发

permissions:
  contents: write

jobs:
  sync-interview:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Run Daily Interview Sync Script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: npm run sync:interview

      - name: 📤 Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            DAY_OF_WEEK=$(date +%u) # 1=周一, 7=周日
            if [ "$DAY_OF_WEEK" = "7" ]; then
              COMMIT_MSG="chore(interview): weekly concentrated production deploy for $(date +'%Y-%m-%d')"
              echo "🚀 今天是周日，自动触发 Netlify 每周集中生产构建部署！"
            else
              COMMIT_MSG="chore(interview): daily automated sync for $(date +'%Y-%m-%d') [skip netlify] [skip ci]"
              echo "ℹ️ 今天是平时归档，已添加 [skip netlify] 跳过 Netlify 构建以节省额度。"
            fi
            git commit -m "$COMMIT_MSG"
            git push origin main
            echo "✅ 成功提交并推送每日最新名企面经！"
          else
            echo "ℹ️ 无新增变动，跳过提交。"
          fi
